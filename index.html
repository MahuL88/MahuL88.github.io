<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portofolio – Computer Vision & Edge AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#F6F7FF;--surface:rgba(255,255,255,.82);--ink:#1B2347;--muted:#5C6688;--line:#DCE1F3;--accent:#3247E6;--box:#E5195E;--chip:#E8ECFF}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;color:var(--ink);font:400 17px/1.65 "IBM Plex Sans",system-ui,sans-serif;
background:
radial-gradient(circle at 12% 8%,#DCE4FF 0,transparent 38%),
radial-gradient(circle at 92% 18%,#FFDDE8 0,transparent 34%),
radial-gradient(circle at 80% 70%,#D6F4EA 0,transparent 36%),
radial-gradient(rgba(27,35,71,.09) 1px,transparent 1.2px) 0 0/22px 22px,
var(--bg);background-attachment:fixed}
.cap,.card{box-shadow:0 1px 0 rgba(27,35,71,.04),0 8px 24px -12px rgba(50,71,230,.18)}
.wrap{max-width:1040px;margin:0 auto;padding:0 24px}
h1,h2,h3{font-family:"Bricolage Grotesque","IBM Plex Sans",system-ui,sans-serif;line-height:1.1;margin:0}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--box);outline-offset:3px}
nav{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;justify-content:space-between;align-items:center;height:56px}
nav b{font-family:"Bricolage Grotesque",sans-serif;font-size:19px}
nav div a{margin-left:20px;color:var(--muted);text-decoration:none;font-size:15px}
nav div a:hover{color:var(--ink)}
/* hero */
.hero{padding:88px 0 64px}
.bbox{position:relative;display:inline-block;border:3px solid var(--box);padding:14px 26px 18px;margin-top:18px}
.bbox::before{content:attr(data-label);position:absolute;left:-3px;top:-30px;background:var(--box);color:#fff;font:600 14px/1 "IBM Plex Sans",sans-serif;padding:7px 10px}
.hero h1{font-size:clamp(38px,7vw,76px);font-weight:800;letter-spacing:-.02em}
.hero p{max-width:60ch;font-size:19px;color:var(--muted);margin:28px 0 30px}
.btns{display:flex;flex-wrap:wrap;gap:12px}
.btn{display:inline-block;padding:11px 20px;border:2px solid var(--ink);color:var(--ink);text-decoration:none;font-weight:600;font-size:15px}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn:hover{border-color:var(--accent)}
section{padding:56px 0;border-top:1px solid var(--line)}
section>.wrap>h2{font-size:clamp(28px,4vw,40px);margin-bottom:8px}
.sub{color:var(--muted);margin:0 0 32px;max-width:62ch}
/* kemampuan */
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.cap{background:var(--surface);border:1px solid var(--line);padding:20px}
.cap h3{font-size:19px;margin-bottom:8px}
.cap p{margin:0;font-size:15px;color:var(--muted)}
.cap small{display:block;margin-top:10px;font-size:13px;color:var(--accent);font-weight:600}
/* proyek utama */
.feat{display:grid;grid-template-columns:1.1fr 1fr;gap:36px;align-items:center;padding:34px 0;border-bottom:1px solid var(--line)}
.feat:last-child{border-bottom:0}
.feat:nth-child(even) .media-box{order:2}
.media-box{position:relative;border:3px solid var(--box);background:var(--chip);overflow:hidden;width:100%;height:auto}
.media-box::before{content:attr(data-tag);position:absolute;left:0;top:0;z-index:2;background:var(--box);color:#fff;font:600 13px/1 "IBM Plex Sans",sans-serif;padding:6px 9px}
.media-box img{display:block;width:100%;height:auto;z-index:1}
.feat h3{font-size:28px;margin-bottom:10px}
.feat p{margin:0 0 12px}
.feat .lbl{font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.chips span{background:var(--chip);padding:4px 10px;font-size:13.5px;font-weight:500}
.links a{margin-right:18px;font-weight:600}
/* proyek lain */
.more{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);padding:20px;display:flex;flex-direction:column}
.card h3{font-size:18px;margin-bottom:6px}
.card p{margin:0 0 10px;font-size:15px;color:var(--muted);flex:1}
.card .links{font-size:14px}
/* skill & kontak */
.skills{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:20px}
.skills h3{font-size:17px;margin-bottom:8px}
.skills .chips{margin:0}
footer{padding:48px 0 64px;border-top:1px solid var(--line)}
footer p{margin:6px 0;color:var(--muted)}
@media(max-width:760px){.feat{grid-template-columns:1fr;gap:20px}.feat:nth-child(even) .media-box{order:0}.hero{padding:60px 0 40px}nav div a:nth-child(n+3){display:none}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
<body>

<nav><div class="wrap"><b id="navName"></b><div><a href="#proyek">Proyek</a><a href="#kemampuan">Kemampuan</a><a href="#kontak">Kontak</a></div></div></nav>

<header class="hero"><div class="wrap">
  <span class="bbox" id="bbox"><h1 id="name"></h1></span>
  <p id="intro"></p>
  <div class="btns" id="heroBtns"></div>
</div></header>

<section id="kemampuan"><div class="wrap">
  <h2>Ruang Lingkup Pekerjaan</h2>
  <p class="sub" id="capSub"></p>
  <div class="grid4" id="caps"></div>
</div></section>

<section id="proyek"><div class="wrap">
  <h2>Proyek</h2>
  <p class="sub">Tiga proyek yang paling mewakili kemampuan saya di computer vision.</p>
  <div id="featured"></div>
</div></section>

<section><div class="wrap">
  <h2>Proyek lainnya</h2>
  <p class="sub">Machine learning, NLP, dan analisis data.</p>
  <div class="more" id="more"></div>
</div></section>

<section><div class="wrap">
  <h2>Skill</h2>
  <div class="skills" id="skills" style="margin-top:24px"></div>
</div></section>

<section><div class="wrap">
  <h2>Pendidikan &amp; pengalaman</h2>
  <div class="more" id="edu" style="margin-top:24px"></div>
</div></section>

<footer id="kontak"><div class="wrap">
  <h2 style="font-size:28px;margin-bottom:12px">Kontak</h2>
  <div id="contact"></div>
  <p style="margin-top:28px;font-size:14px" id="foot"></p>
</div></footer>

</html>
